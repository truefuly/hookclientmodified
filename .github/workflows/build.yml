name: Build

# Builds the mod on every push and pull request. Every push to main also publishes a GitHub
# Release with the jar - the HookVisuals Loader downloads the newest release automatically.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 25 runs Gradle/Loom, Java 21 compiles the mod (toolchain in build.gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - uses: actions/upload-artifact@v4
        with:
          name: HookVisuals
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n1)
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v${VERSION}-build.${{ github.run_number }}"
          cp "$JAR" "HookVisuals-${VERSION}.jar"
          gh release create "$TAG" "HookVisuals-${VERSION}.jar" \
            --title "HookVisuals ${VERSION} (build ${{ github.run_number }})" \
            --notes "Automatic build of ${GITHUB_SHA::7}." --latest
